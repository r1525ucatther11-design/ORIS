<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель — Бункер</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #080a0f;
            --bg-panel: #0d1117;
            --bg-card: #161b22;
            --border: #21262d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent: #d4a017;
            --accent-hover: #e8b647;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            line-height: 1.5;
        }
        a { text-decoration: none; color: inherit; }

        .navbar {
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .navbar-inner {
            max-width: 1400px; margin: 0 auto; padding: 0 20px;
            height: 90px; display: flex; align-items: center;
        }
        .nav-logo { height: 60px; width: auto; margin-right: 50px; }
        .nav-links { display: flex; gap: 40px; height: 100%; }
        .nav-links a {
            font-size: 15px; font-weight: 600; color: var(--text-muted);
            transition: color 0.2s; display: flex; align-items: center;
            position: relative; padding-top: 4px;
        }
        .nav-links a.active { color: var(--accent); }
        .nav-links a.active::after {
            content: ''; position: absolute; bottom: 0; left: 0;
            width: 100%; height: 3px; background-color: var(--accent);
        }
        .nav-links a:hover { color: var(--accent-hover); }

        .admin-layout {
            max-width: 1400px; margin: 0 auto; padding: 40px 20px;
            display: grid; grid-template-columns: 1fr 1.5fr; gap: 30px;
        }

        .admin-panel {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
        }

        .panel-title {
            font-size: 22px; color: #fff; margin-bottom: 25px;
            padding-bottom: 15px; border-bottom: 1px solid var(--border); font-weight: 700;
        }

        .form-group { margin-bottom: 20px; }
        .form-group label { 
            display: block; color: var(--accent); margin-bottom: 8px; 
            font-weight: 600; font-size: 14px;
        }
        .form-group input, .form-group select { 
            width: 100%; padding: 12px; background: var(--bg-dark); 
            border: 1px solid var(--border); color: var(--text-main); 
            border-radius: 6px; font-family: inherit; font-size: 14px;
        }
        .form-group input:focus, .form-group select:focus { border-color: var(--accent); outline: none; }
        
        .btn-submit {
            background: var(--accent); color: var(--bg-dark); border: none;
            padding: 14px; font-weight: 700; border-radius: 6px; cursor: pointer;
            width: 100%; font-size: 16px; transition: background 0.2s;
        }
        .btn-submit:hover { background: var(--accent-hover); }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .search-input, .filter-select {
            padding: 10px 15px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }
        .search-input { width: 200px; }
        .filter-select { width: 180px; }
        .search-input:focus, .filter-select:focus { border-color: var(--accent); outline: none; }

        .table-wrapper { overflow-x: auto; max-height: 600px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
        th { color: var(--accent); font-weight: 600; text-transform: uppercase; font-size: 12px; position: sticky; top: 0; background: var(--bg-panel); }
        td { color: var(--text-main); }
        
        .btn-edit {
            background: #d4a017; color: #000; border: none; padding: 6px 12px;
            border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 12px;
            transition: background 0.2s; text-decoration: none; display: inline-block;
        }
        .btn-edit:hover { background: #e8b647; }

        .btn-delete {
            background: #8e0e00; color: white; border: none; padding: 6px 12px;
            border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 12px;
            transition: background 0.2s;
        }
        .btn-delete:hover { background: #c41a0e; }

        .ql-container { 
            background: var(--bg-dark); font-family: inherit; 
            border-bottom-left-radius: 6px; border-bottom-right-radius: 6px; 
            border: 1px solid var(--border); border-top: none;
        }
        .ql-toolbar { 
            background: var(--bg-card); border: 1px solid var(--border); 
            border-top-left-radius: 6px; border-top-right-radius: 6px; 
        }
        .ql-snow .ql-stroke { stroke: #8b95a5; }
        .ql-snow .ql-picker { color: #8b95a5; }
        .ql-editor { color: var(--text-main) !important; min-height: 150px; }
        .ql-editor.ql-blank::before { color: #5a6373 !important; }

        @media (max-width: 1024px) {
            .admin-layout { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="navbar-inner">
            <a href="/">
                <img src="https://i.postimg.cc/HLSGxWKh/bunker.png" alt="Бункер" class="nav-logo">
            </a>
            <nav class="nav-links">
                <a href="/">Главная</a>
                <a href="/cards">Карты</a>
                <a href="/rules">Правила</a>
                <a href="/admin" class="active">Админка</a>
            </nav>
        </div>
    </header>

    <div class="admin-layout">
        <div class="admin-panel">
            <div class="panel-title">Добавить новую карту</div>
            
            <form method="POST" action="/admin/create" id="adminForm">
                <div class="form-group">
                    <label>Название карты</label>
                    <input type="text" name="title" id="titleInput" required placeholder="Например: Врач">
                </div>

                <div class="form-group">
                    <label>Категория</label>
                    <select name="category">
                        $foreach (cat in Categories)
                            <option value="${cat.Name}">${cat.Name}</option>
                        $endfor
                    </select>
                </div>

                <div class="form-group">
                    <label>Описание</label>
                    <div id="editor-container"></div>
                    <input type="hidden" name="description" id="descriptionInput">
                </div>

                <button type="submit" class="btn-submit">Сохранить в базу</button>
            </form>
        </div>

        <div class="admin-panel">
            <div style="text-align: right; margin-bottom: 15px;">
                <a href="/logout" style="color: #8b949e; font-size: 13px;">Выйти →</a>
            </div>

            <div class="table-header">
                <div class="panel-title" style="margin-bottom: 0; border: none; padding: 0;">Управление картами</div>
                <div style="display: flex; gap: 10px;">
                    <select id="filterCategory" class="filter-select">
                        <option value="">Все категории</option>
                        $foreach (cat in Categories)
                            <option value="${cat.Name}">${cat.Name}</option>
                        $endfor
                    </select>
                    <input type="text" id="searchTable" class="search-input" placeholder="Поиск по названию...">
                </div>
            </div>
            <div class="table-wrapper">
                <table id="cardsTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Название</th>
                            <th>Категория</th>
                            <th>Действие</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${TableRows}
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script>
        var quill = new Quill('#editor-container', {
            theme: 'snow',
            placeholder: 'Введите описание...',
            modules: {
                toolbar: [
                    ['bold', 'italic', 'underline'],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    ['clean']
                ]
            }
        });

        var form = document.getElementById('adminForm');
        form.onsubmit = function() {
            var title = document.getElementById('titleInput').value.trim();
            var description = quill.root.innerHTML;
            var regex = /^[А-Яа-яA-Za-z0-9\s\-]{2,80}$/;

            if (!regex.test(title)) {
                alert("Ошибка! Название должно быть от 2 до 80 символов и содержать только буквы и цифры.");
                return false;
            }

            if (description === '<p><br></p>' || description.trim() === '') {
                alert("Ошибка! Описание не может быть пустым.");
                return false;
            }

            document.getElementById('descriptionInput').value = description;
            return true;
        };

        function filterTable() {
            var filterText = document.getElementById('searchTable').value.toLowerCase();
            var filterCat = document.getElementById('filterCategory').value;
            var rows = document.querySelectorAll('#cardsTable tbody tr');

            rows.forEach(function(row) {
                var title = row.cells[1].textContent.toLowerCase();
                var category = row.cells[2].textContent.trim();
                
                var matchesText = title.includes(filterText);
                var matchesCat = (filterCat === "" || category === filterCat);

                if (matchesText && matchesCat) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        }

        document.getElementById('searchTable').addEventListener('keyup', filterTable);
        document.getElementById('filterCategory').addEventListener('change', filterTable);
    </script>
</body>
</html>
