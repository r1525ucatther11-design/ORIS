<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование карты — Бункер</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #080a0f;
            --bg-panel: #0d1117;
            --bg-card: #161b22;
            --border: #21262d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent: #d4a017;
            --accent-hover: #e8b647;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            line-height: 1.5;
        }
        a { text-decoration: none; color: inherit; }
        .navbar {
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .navbar-inner {
            max-width: 1400px; margin: 0 auto; padding: 0 20px;
            height: 90px; display: flex; align-items: center;
        }
        .nav-logo { height: 60px; width: auto; margin-right: 50px; }
        .nav-links { display: flex; gap: 40px; height: 100%; }
        .nav-links a {
            font-size: 15px; font-weight: 600; color: var(--text-muted);
            transition: color 0.2s; display: flex; align-items: center;
            position: relative; padding-top: 4px;
        }
        .nav-links a.active { color: var(--accent); }
        .nav-links a.active::after {
            content: ''; position: absolute; bottom: 0; left: 0;
            width: 100%; height: 3px; background-color: var(--accent);
        }
        .nav-links a:hover { color: var(--accent-hover); }

        .admin-layout {
            max-width: 600px; margin: 40px auto; padding: 0 20px;
        }
        .admin-panel {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
        }
        .panel-title {
            font-size: 22px; color: #fff; margin-bottom: 25px;
            padding-bottom: 15px; border-bottom: 1px solid var(--border); font-weight: 700;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { 
            display: block; color: var(--accent); margin-bottom: 8px; 
            font-weight: 600; font-size: 14px;
        }
        .form-group input, .form-group select { 
            width: 100%; padding: 12px; background: var(--bg-dark); 
            border: 1px solid var(--border); color: var(--text-main); 
            border-radius: 6px; font-family: inherit; font-size: 14px;
        }
        .btn-submit {
            background: var(--accent); color: var(--bg-dark); border: none;
            padding: 14px; font-weight: 700; border-radius: 6px; cursor: pointer;
            width: 100%; font-size: 16px; transition: background 0.2s;
        }
        .btn-submit:hover { background: var(--accent-hover); }
        .btn-cancel {
            display: inline-block; text-align: center; margin-top: 10px;
            background: transparent; color: var(--text-muted); border: 1px solid var(--border);
            padding: 14px; font-weight: 700; border-radius: 6px;
            width: 100%; font-size: 16px;
        }
        .ql-container { 
            background: var(--bg-dark); font-family: inherit; 
            border-bottom-left-radius: 6px; border-bottom-right-radius: 6px; 
            border: 1px solid var(--border); border-top: none;
        }
        .ql-toolbar { 
            background: var(--bg-card); border: 1px solid var(--border); 
            border-top-left-radius: 6px; border-top-right-radius: 6px; 
        }
        .ql-editor { color: var(--text-main) !important; min-height: 150px; }
        .ql-editor.ql-blank::before { color: #5a6373 !important; }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="navbar-inner">
            <a href="/">
                <img src="https://i.postimg.cc/HLSGxWKh/bunker.png" alt="Бункер" class="nav-logo">
            </a>
            <nav class="nav-links">
                <a href="/">Главная</a>
                <a href="/cards">Карты</a>
                <a href="/rules">Правила</a>
                <a href="/admin" class="active">Админка</a>
            </nav>
        </div>
    </header>

    <div class="admin-layout">
        <div class="admin-panel">
            <div class="panel-title">Редактировать карту</div>
            
            <form method="POST" action="/admin/update?id=${Card.Id}" id="editForm">
                <div class="form-group">
                    <label>Название карты</label>
                    <input type="text" name="title" id="titleInput" value="${Card.Title}" required>
                </div>

                <div class="form-group">
                    <label>Категория</label>
                    <select name="category" id="catSelect">
                        $foreach (cat in Categories)
                            $if (cat.Name == Card.Category)
                                <option value="${cat.Name}" selected>${cat.Name}</option>
                            $else
                                <option value="${cat.Name}">${cat.Name}</option>
                            $endif
                        $endfor
                    </select>
                </div>

                <div class="form-group">
                    <label>Описание</label>
                    <div id="editor-container"></div>
                    <input type="hidden" name="description" id="descriptionInput">
                </div>

                <button type="submit" class="btn-submit">Сохранить изменения</button>
                <a href="/admin" class="btn-cancel">Отмена</a>
            </form>
        </div>
    </div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script>
        var currentDescription = `${Card.Description}`;

        var quill = new Quill('#editor-container', {
            theme: 'snow',
            placeholder: 'Введите описание...',
            modules: { toolbar: [['bold', 'italic', 'underline'], [{ 'list': 'ordered'}, { 'list': 'bullet' }], ['clean']] }
        });
        
        quill.root.innerHTML = currentDescription;
        document.getElementById('descriptionInput').value = currentDescription;

        document.getElementById('editForm').onsubmit = function() {
            document.getElementById('descriptionInput').value = quill.root.innerHTML;
            return true;
        };
    </script>
</body>
</html>
