<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список пользователей</title>
</head>
<body>
    <h1>Список пользователей</h1>
    <ul>
        $foreach(var user in Users)
            $if(user.IsActive)
                <li>${user.Name} — активен</li>
            $else
                <li>${user.Name} — неактивен</li>
            $endif
        $endfor
    </ul>
</body>
</html>
